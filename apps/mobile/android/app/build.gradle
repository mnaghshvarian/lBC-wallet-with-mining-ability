apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// The app version comes from apps/mobile/package.json: 1.2.3 -> versionName "1.2.3", versionCode 10203.
def appVersion = new JsonSlurper().parse(file('../../package.json')).version
def (vMajor, vMinor, vPatch) = appVersion.tokenize('.-')[0..2].collect { it as int }

android {
    namespace = "io.github.mnaghshvarian.lbcwallet"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.mnaghshvarian.lbcwallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName appVersion
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing key from the environment (CI keeps it in repository secrets; see docs/BUILDING.md).
    signingConfigs {
        release {
            def keystore = System.getenv('LBC_ANDROID_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('LBC_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LBC_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('LBC_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv('LBC_ANDROID_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    // No Google-encrypted dependency report inside the APK (keeps builds inspectable).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

