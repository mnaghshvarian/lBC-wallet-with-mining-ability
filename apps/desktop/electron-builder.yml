# Packaging for LBC Wallet (https://www.electron.build)
appId: io.github.mnaghshvarian.lbcwallet
productName: LBC Wallet
copyright: Copyright © 2026 LBC Wallet contributors

directories:
  output: release/${version}
  buildResources: build

# Everything is bundled by electron-vite, so no node_modules are shipped.
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
# Mining runs in a utility process with worker threads, which load their
# scripts from disk; keep the bundled main-process code outside the asar.
asarUnpack:
  - out/main/**
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Lock down the Electron binary (https://www.electronjs.org/docs/latest/tutorial/fuses).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  category: Finance
  icon: build/icons
  synopsis: Non-custodial LBRY Credits wallet with a built-in miner
  description: >-
    LBC Wallet is a non-custodial desktop wallet for LBRY Credits (LBC). It restores
    LBRY Desktop / Odysee and BIP39 recovery phrases, unlocks tips and supports,
    and mines LBC through a pool or your own node.
  maintainer: LBC Wallet contributors <m.naghshvarian@gmail.com>
  vendor: LBC Wallet contributors
  executableName: lbc-wallet
  # Name the .desktop file after package.json "desktopName" so the window's
  # app_id / WM_CLASS matches it and docks group the running window correctly.
  syncDesktopName: true

deb:
  packageName: lbc-wallet
  artifactName: lbc-wallet_${version}_${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.finance
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

publish:
  provider: github
  owner: mnaghshvarian
  repo: lBC-wallet-with-mining-ability
  releaseType: draft
