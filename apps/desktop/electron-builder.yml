# Packaging for LBC Wallet (https://www.electron.build)
appId: io.github.mnaghshvarian.lbcwallet
productName: LBC Wallet
copyright: Copyright © 2026 LBC Wallet contributors

directories:
  output: release/${version}
  buildResources: build

# Everything is bundled by electron-vite, so no node_modules are shipped.
files:
  - out/**
  - resources/**
  - '!resources/bin/**'
  - package.json
  - '!**/*.map'
# The built-in full node (lbcd, built by scripts/build-lbcd.sh) and the legal texts
# live next to the app, outside the asar archive.
extraResources:
  - from: resources/bin/${os}-${arch}
    to: bin
  - from: ../../DISCLAIMER.md
    to: DISCLAIMER.md
  - from: ../../LICENSE
    to: LICENSE.txt
# Mining runs in a utility process with worker threads, which load their
# scripts from disk; keep the bundled main-process code outside the asar.
asarUnpack:
  - out/main/**
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Lock down the Electron binary (https://www.electronjs.org/docs/latest/tutorial/fuses).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# Download names carry no version, so ".../releases/latest/download/<name>" links in the
# manual always point at the newest release.
artifactName: LBC-Wallet-${os}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
  category: Finance
  icon: build/icons
  synopsis: Non-custodial LBRY Credits wallet with a built-in miner
  description: >-
    LBC Wallet is a non-custodial desktop wallet for LBRY Credits (LBC). It restores
    LBRY Desktop / Odysee and BIP39 recovery phrases, unlocks tips and supports,
    mines LBC through a pool or solo, and can run a built-in LBRY full node.
    Experimental and unaudited: use at your own risk.
  maintainer: LBC Wallet contributors <m.naghshvarian@gmail.com>
  vendor: LBC Wallet contributors
  executableName: lbc-wallet
  # Name the .desktop file after package.json "desktopName" so the window's
  # app_id / WM_CLASS matches it and docks group the running window correctly.
  syncDesktopName: true

deb:
  packageName: lbc-wallet
  artifactName: lbc-wallet_${arch}.${ext}

rpm:
  packageName: lbc-wallet
  artifactName: lbc-wallet.${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  # Shows the disclaimer and MIT license; installing requires accepting it.
  license: build/license_en.txt
  artifactName: LBC-Wallet-Setup-${arch}.${ext}

portable:
  artifactName: LBC-Wallet-Portable-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.finance
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: LBC-Wallet-mac-${arch}.${ext}
  # Shown when the disk image is opened; it opens only after "Agree".
  license: build/license_en.txt

publish:
  provider: github
  owner: mnaghshvarian
  repo: lBC-wallet-with-mining-ability
  releaseType: draft
