name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LBCD_VERSION: v0.22.119

jobs:
  checks:
    name: Typecheck, unit tests, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end against lbcd regtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: Build lbcd ${{ env.LBCD_VERSION }}
        run: go install github.com/lbryio/lbcd@${{ env.LBCD_VERSION }}
      - run: npm ci
      - name: Wallet, hub protocol and mining end-to-end tests
        run: LBCD_BIN="$(go env GOPATH)/bin/lbcd" npm run test:e2e
      - name: Desktop UI end-to-end test
        run: |
          npm run build
          LBCD_BIN="$(go env GOPATH)/bin/lbcd" SCREENSHOT_DIR="$RUNNER_TEMP/screenshots" \
            xvfb-run -a -s "-screen 0 1440x900x24" npm run test:ui -w lbc-wallet-desktop
      - name: Package the Linux app (fused production build)
        working-directory: apps/desktop
        run: CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --config electron-builder.yml --linux dir --publish never
      - name: Desktop UI end-to-end test against the packaged app (sandbox on)
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          APP_EXECUTABLE="$(echo "$PWD"/apps/desktop/release/*/linux-unpacked/lbc-wallet)" \
          LBCD_BIN="$(go env GOPATH)/bin/lbcd" SCREENSHOT_DIR="$RUNNER_TEMP/screenshots-packaged" \
            xvfb-run -a -s "-screen 0 1440x900x24" npm run test:ui -w lbc-wallet-desktop
      - name: Network privacy audit of the packaged app
        run: |
          APP_EXECUTABLE="$(echo "$PWD"/apps/desktop/release/*/linux-unpacked/lbc-wallet)" \
            xvfb-run -a npm run test:privacy -w lbc-wallet-desktop
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/screenshots-packaged
          if-no-files-found: ignore

  wasm:
    name: Miner WASM is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install clang and lld
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld >/dev/null
      - run: npm ci
      - name: Rebuild the scanner from C
        run: npm run build:wasm
      - name: Committed module matches the C source
        run: git diff --exit-code --stat -- packages/core/src/mining/
      - name: Miner tests against the rebuilt module
        run: npm test -w @lbcwallet/core -- mining
