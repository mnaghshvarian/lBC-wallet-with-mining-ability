name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LBCD_VERSION: v0.22.119

jobs:
  checks:
    name: Typecheck, unit tests, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end against lbcd regtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: Build lbcd ${{ env.LBCD_VERSION }}
        run: go install github.com/lbryio/lbcd@${{ env.LBCD_VERSION }}
      - run: npm ci
      - name: Wallet, hub protocol and mining end-to-end tests
        run: LBCD_BIN="$(go env GOPATH)/bin/lbcd" npm run test:e2e
      - name: Desktop UI end-to-end test
        run: |
          npm run build
          LBCD_BIN="$(go env GOPATH)/bin/lbcd" SCREENSHOT_DIR="$RUNNER_TEMP/screenshots" \
            xvfb-run -a -s "-screen 0 1440x900x24" npm run test:ui -w lbc-wallet-desktop
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  wasm:
    name: Miner WASM is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild the scanner and compare
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld >/dev/null
          node packages/miner-wasm/build.mjs
          npx --yes vitest@5.0.5 run --root packages/core --dir test mining
          git diff --stat -- packages/core/src/mining/lbry-scan-wasm.generated.ts || true
