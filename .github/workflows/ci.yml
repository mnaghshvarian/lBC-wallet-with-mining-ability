name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end against lbcd regtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: Build lbcd (the bundled full node) from its verified release source
        run: bash scripts/build-lbcd.sh linux-x64
      - name: Build btcd (Bitcoin side of the swap tests) from its verified release source
        run: bash scripts/build-btcd.sh
      - run: npm ci
      - name: Wallet, hub protocol, mining and atomic swap end-to-end tests
        run: LBCD_BIN="$PWD/apps/desktop/resources/bin/linux-x64/lbcd" BTCD_BIN="$PWD/.tools/btcd/btcd" npm run test:e2e
      - name: Desktop UI end-to-end test
        run: |
          npm run build
          LBCD_BIN="$PWD/apps/desktop/resources/bin/linux-x64/lbcd" SCREENSHOT_DIR="$RUNNER_TEMP/screenshots" \
            xvfb-run -a -s "-screen 0 1440x900x24" npm run test:ui -w lbc-wallet-desktop
      - name: Package the Linux app (fused production build)
        working-directory: apps/desktop
        run: CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --config electron-builder.yml --linux dir --publish never
      - name: Desktop UI end-to-end test against the packaged app (sandbox on)
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          APP_EXECUTABLE="$(echo "$PWD"/apps/desktop/release/*/linux-unpacked/lbc-wallet)" \
          LBCD_BIN="$PWD/apps/desktop/resources/bin/linux-x64/lbcd" SCREENSHOT_DIR="$RUNNER_TEMP/screenshots-packaged" \
            xvfb-run -a -s "-screen 0 1440x900x24" npm run test:ui -w lbc-wallet-desktop
      - name: Network privacy audit of the packaged app
        run: |
          APP_EXECUTABLE="$(echo "$PWD"/apps/desktop/release/*/linux-unpacked/lbc-wallet)" \
            xvfb-run -a npm run test:privacy -w lbc-wallet-desktop
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/screenshots-packaged
          if-no-files-found: ignore

  installed:
    name: Installed app on ${{ matrix.name }} (installer, UI test, uninstall)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            lbcd: win-x64
          - os: macos-latest
            name: macOS
            lbcd: mac-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: Build lbcd (bundled in the app, and the local test network)
        run: bash scripts/build-lbcd.sh ${{ matrix.lbcd }}
      - run: npm ci
      - run: npm run build
      - name: Build the installer (unsigned, like the release builds without signing keys)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx electron-builder --config electron-builder.yml --win nsis --x64 --publish never
          else
            npx electron-builder --config electron-builder.yml --mac dmg --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi
      - name: Install silently with the default options (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release/*/LBC-Wallet-Setup-x64.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\LBC Wallet'
          foreach ($f in 'LBC Wallet.exe', 'Uninstall LBC Wallet.exe', 'resources\bin\lbcd.exe', 'resources\DISCLAIMER.md', 'resources\LICENSE.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          if (-not (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\LBC Wallet.lnk'))) { throw 'no Start menu shortcut' }
          "APP_EXECUTABLE=$dir\LBC Wallet.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LBCD_TEST_BIN=$dir\resources\bin\lbcd.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install from the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg="$(ls apps/desktop/release/*/LBC-Wallet-mac-arm64.dmg | head -1)"
          mkdir -p "$RUNNER_TEMP/dmg"
          # The image shows the license first: skip the pager and answer "agree"
          # (`|| true`: yes ends with SIGPIPE, and steps run with pipefail).
          { yes || true; } | PAGER=true hdiutil attach -nobrowse -noautoopen -mountpoint "$RUNNER_TEMP/dmg" "$dmg" > /dev/null
          ditto "$RUNNER_TEMP/dmg/LBC Wallet.app" "/Applications/LBC Wallet.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          codesign --verify --deep --strict "/Applications/LBC Wallet.app"
          test -x "/Applications/LBC Wallet.app/Contents/Resources/bin/lbcd"
          test -f "/Applications/LBC Wallet.app/Contents/Resources/DISCLAIMER.md"
          echo "APP_EXECUTABLE=/Applications/LBC Wallet.app/Contents/MacOS/LBC Wallet" >> "$GITHUB_ENV"
          echo "LBCD_TEST_BIN=/Applications/LBC Wallet.app/Contents/Resources/bin/lbcd" >> "$GITHUB_ENV"
      - name: UI end-to-end test against the installed app and a local test network
        # The test network runs the lbcd the installer put on disk.
        run: LBCD_BIN="$LBCD_TEST_BIN" SCREENSHOT_DIR="$RUNNER_TEMP/screenshots-installed" npm run test:ui -w lbc-wallet-desktop
      - name: Network privacy audit of the installed app
        run: npm run test:privacy -w lbc-wallet-desktop
      - name: Uninstall; wallet files stay (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\LBC Wallet'
          $wallets = Join-Path $env:APPDATA 'LBC Wallet\wallets'
          New-Item -ItemType Directory -Force -Path $wallets | Out-Null
          Set-Content -Path (Join-Path $wallets 'keep.lbcwallet.json') -Value '{}'
          Start-Process -FilePath (Join-Path $dir 'Uninstall LBC Wallet.exe') -ArgumentList '/S' -Wait
          # The uninstaller continues from a copy of itself; wait for it to finish.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'LBC Wallet.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir 'LBC Wallet.exe')) { throw 'the uninstaller left the app behind' }
          if (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\LBC Wallet.lnk')) { throw 'the uninstaller left the Start menu shortcut' }
          if (-not (Test-Path (Join-Path $wallets 'keep.lbcwallet.json'))) { throw 'the uninstaller deleted wallet files' }
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.name }}
          path: ${{ runner.temp }}/screenshots-installed
          if-no-files-found: ignore

  android:
    name: Android app (regtest stack test, APK, emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: Build lbcd for the local test network
        run: bash scripts/build-lbcd.sh linux-x64
      - run: npm ci
      - name: Android wallet stack against lbcd regtest
        run: LBCD_BIN="$PWD/apps/desktop/resources/bin/linux-x64/lbcd" npm run test:e2e -w lbc-wallet-mobile
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build the debug APK
        run: npm run build:android:debug -w lbc-wallet-mobile
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app in an Android emulator against the test network
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: LBCD_BIN="$PWD/apps/desktop/resources/bin/linux-x64/lbcd" SCREENSHOT_DIR="$RUNNER_TEMP/android-screenshots" npm run test:device -w lbc-wallet-mobile
      - name: Upload Android screenshots and the debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            ${{ runner.temp }}/android-screenshots
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

  wasm:
    name: Miner WASM is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install clang and lld
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld >/dev/null
      - run: npm ci
      - name: Rebuild the scanner from C
        run: npm run build:wasm
      - name: Committed module matches the C source
        run: git diff --exit-code --stat -- packages/core/src/mining/
      - name: Miner tests against the rebuilt module
        run: npm test -w @lbcwallet/core -- mining
