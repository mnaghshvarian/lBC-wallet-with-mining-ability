name: Release

# Builds the installers for Linux, Windows and macOS and the Android APK, and
# attaches them (with SHA-256 checksums) to a draft GitHub release. Either push a
# tag like v1.1.0, or run it from the Actions tab ("Run workflow") with the
# version number; run it without a version to only build (artifacts in the run).
# The draft is published by hand after checking it: Actions → Publish release (publish-release.yml).
#
# Optional signing secrets (see docs/BUILDING.md):
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#            (without them the APK is signed with a throwaway key and the release notes say so)
#   macOS:   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the draft release, e.g. 1.1.0 (must match apps/desktop/package.json). Empty: only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Release tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            tag="v${INPUT_VERSION#v}"
          else
            echo "No version given: only building (the installers are attached to this run)."
            exit 0
          fi
          version="$(jq -r .version apps/desktop/package.json)"
          if [ "$tag" != "v$version" ]; then
            echo "::error::$tag does not match the app version $version in apps/desktop/package.json"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the draft release (or refresh its notes)
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          ANDROID_KEY_SET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          cp docs/release-notes.md "$notes"
          if [ "$ANDROID_KEY_SET" != "true" ]; then
            # The Android job signs with a throwaway key without the secret; say so on the release page.
            printf '\n> ⚠️ **The Android APK of this release is signed with a temporary signing key.** It installs and works, but a later version signed with the project'"'"'s permanent key will not install over it: you would have to uninstall this one first (write down your recovery phrase before you do).\n' >> "$notes"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "LBC Wallet ${TAG#v}" --notes-file "$notes"
          fi
          gh release upload "$TAG" docs/manual/LBC-Wallet-Manual.pdf DISCLAIMER.md --clobber

  build:
    name: Package (${{ matrix.os }})
    needs: [draft]
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
            lbcd: linux-x64 linux-arm64
          - os: windows-latest
            target: --win
            lbcd: win-x64
          - os: macos-latest
            target: --mac
            lbcd: mac-x64 mac-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: Build the bundled full node (lbcd) from its verified release source
        shell: bash
        run: bash scripts/build-lbcd.sh ${{ matrix.lbcd }}
      - name: Tools for .rpm packages
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm >/dev/null
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package and publish to a draft release
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          # Secrets that are not configured arrive as empty strings; electron-builder would
          # try to import an empty CSC_LINK as a certificate, so drop them.
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "$CSC_LINK" ] && [ -z "$WIN_CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          EXTRA=()
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$CSC_LINK" ]; then
            # No Developer ID certificate: ad-hoc sign, because flipping the fuses breaks
            # Electron's own signature and Apple Silicon refuses to run unsigned code.
            # The hardened runtime needs a real identity (it is only required for notarization).
            EXTRA=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          PUBLISH=never
          if [ -n "$TAG" ]; then PUBLISH=always; fi
          npx electron-builder --config electron-builder.yml ${{ matrix.target }} --publish "$PUBLISH" "${EXTRA[@]}"
      - name: Checksums
        shell: bash
        working-directory: apps/desktop
        run: |
          cd release/*/
          if command -v sha256sum >/dev/null; then SUM=(sha256sum); else SUM=(shasum -a 256); fi
          find . -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print0 \
            | xargs -0 "${SUM[@]}" > SHA256SUMS-${{ runner.os }}.txt
          cat SHA256SUMS-${{ runner.os }}.txt
      - name: Attach the checksums to the release
        if: needs.draft.outputs.tag != ''
        shell: bash
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release upload "$TAG" release/*/SHA256SUMS-*.txt --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: lbc-wallet-${{ runner.os }}
          path: |
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.deb
            apps/desktop/release/*/*.rpm
            apps/desktop/release/*/*.tar.gz
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/SHA256SUMS-*.txt
          if-no-files-found: warn

  android:
    name: Package (Android)
    needs: [draft]
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test -w @lbcwallet/services -w @lbcwallet/ui -w lbc-wallet-mobile
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build and sign the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export LBC_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          # One name in every case, so the download links in the docs always work.
          NAME=LBC-Wallet-android.apk
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$LBC_ANDROID_KEYSTORE"
            export LBC_ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export LBC_ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS"
            export LBC_ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            # No release key configured: sign with a throwaway key so the APK installs (the draft job
            # notes it on the release page). An APK signed with a different key can't update this one.
            pass="$(openssl rand -hex 24)"
            echo "::add-mask::$pass"
            keytool -genkeypair -keystore "$LBC_ANDROID_KEYSTORE" -storetype PKCS12 -alias test -keyalg RSA -keysize 4096 \
              -validity 10000 -storepass "$pass" -keypass "$pass" -dname "CN=LBC Wallet test build" > /dev/null
            export LBC_ANDROID_KEYSTORE_PASSWORD="$pass" LBC_ANDROID_KEY_ALIAS=test LBC_ANDROID_KEY_PASSWORD="$pass"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway key (see docs/BUILDING.md)."
          fi
          npm run build:android:release -w lbc-wallet-mobile
          mkdir -p apps/mobile/release
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "apps/mobile/release/$NAME"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "apps/mobile/release/$NAME" | head -3
          cd apps/mobile/release && sha256sum "$NAME" > SHA256SUMS-Android.txt && cat SHA256SUMS-Android.txt
          rm -f "$LBC_ANDROID_KEYSTORE"
      - name: Attach the APK to the release
        if: needs.draft.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release upload "$TAG" apps/mobile/release/*.apk apps/mobile/release/SHA256SUMS-Android.txt --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: lbc-wallet-Android
          path: |
            apps/mobile/release/*.apk
            apps/mobile/release/SHA256SUMS-Android.txt
          if-no-files-found: error
